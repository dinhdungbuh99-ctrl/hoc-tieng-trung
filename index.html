<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0B0E" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FFF8EF" media="(prefers-color-scheme: light)">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Học tiếng Trung</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #FFF8EF; --card: #ffffff; --ink: #3B2415; --muted: #8A6A55; --line: #F1DCC4; --soft: #FFF1D6; --soft2: #FBE3CC;
  --red: #D93A1E; --red-d: #B0281A; --orange: #F07F1A; --amber: #E3A400; --gold-d: #7C5A2E;
  --again: #B0281A; --hard: #E8661C; --okay: #E3A400; --easy: #7C5A2E;
  --zh-serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --ok: #2E7D4F; --ok-bg: #E3F4E8; --bad-bg: #FDE0D8; --part-bg: #FFF0CC; --grid: #E9B9A6;
  --field: #ffffff; --line2: #E6CDB0; --grad: linear-gradient(135deg, #D93A1E 0%, #F07F1A 100%); --on-grad: #ffffff;
  --link: #B0281A; --chip-txt: #7A4A00;
  --c-hq-bg: #FDE0D8; --c-hq: #9C2A14; --c-do-bg: #FFE7CC; --c-do: #8A4300; --c-mn-bg: #FFF3C4; --c-mn: #7A5A00; --c-dt-bg: #EFE3CF; --c-dt: #5E4320;
  --sb-dt: #A8855A; --sb-do: #F07F1A; --sb-mn: #E3A400; --sb-hq: #D93A1E; --sb-cm: #F1DCC4;
  --zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  --radius: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.zh { font-family: var(--zh); }
main { max-width: 640px; margin: 0 auto; padding: 14px 14px 100px; }
h1 { font-size: 24px; margin: 4px 0 2px; font-weight: 600; }
h1 small, .en { font-size: .62em; color: var(--muted); font-weight: 400; }
h2 { font-size: 16px; margin: 20px 0 8px; color: var(--red-d); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 12px 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.btn { appearance: none; border: 1px solid var(--line2); background: transparent; color: var(--ink);
  border-radius: 999px; padding: 10px 16px; font-size: 15px; cursor: pointer; font-family: inherit; }
.btn.primary { background: var(--grad); border-color: transparent; color: var(--on-grad); font-weight: 600; }
.btn.big { width: 100%; padding: 14px; font-size: 17px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--link); }
.btn.soft { background: var(--soft); border-color: transparent; color: var(--chip-txt); }
.btn.danger { color: var(--again); }
.btn:disabled { opacity: .5; }
.btn .en { color: inherit; opacity: .8; }
input, textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px;
  font-size: 16px; background: var(--field); color: var(--ink); font-family: inherit; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--orange); border-color: transparent; }
textarea { min-height: 90px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; border: 1px solid transparent; white-space: nowrap; }
.st-hayquen { background: var(--c-hq-bg); color: var(--c-hq); }
.st-dangon { background: var(--c-do-bg); color: var(--c-do); }
.st-moinap { background: var(--c-mn-bg); color: var(--c-mn); }
.st-dathuoc { background: var(--c-dt-bg); color: var(--c-dt); }
.st-chuamo { background: transparent; color: var(--muted); border-color: var(--line); }

/* hidden pinyin + Vietnamese */
.pyh { display: inline-block; filter: blur(5px); cursor: pointer; user-select: none; transition: filter .15s; color: var(--orange); }
.pyh.on, body.py-show .pyh { filter: none; }
.pyp { display: inline-flex; align-items: center; gap: 4px; background: var(--soft); color: var(--chip-txt); border-radius: 999px; padding: 3px 10px; font-size: 14px; }
.pyp .pyh { color: var(--chip-txt); }
.vt { cursor: pointer; }
.vt > b { display: inline-block; font-size: 10px; font-weight: 600; background: var(--soft2); color: #9C2A14; border-radius: 6px; padding: 0 5px; margin-left: 4px; vertical-align: 1px; }
.vt > span { display: none; }
.vt.on > span { display: inline; color: var(--ink); margin-left: 4px; }
.vt.on > b { display: none; }

/* today */
.top { display: flex; justify-content: space-between; align-items: flex-start; }
.streak { background: #FFE9C2; color: #8A4B00; border-radius: 999px; padding: 4px 11px; font-size: 13px; white-space: nowrap; }
.hero { background: var(--red); color: #fff; border-radius: 22px; padding: 18px; margin-top: 14px; }
.hero .lab { font-size: 13px; opacity: .9; }
.hero .en, .hero .go .en { color: inherit; opacity: .85; }
.hero .n { font-size: 52px; font-weight: 600; line-height: 1.05; }
.hero .sub { font-size: 14px; opacity: .95; }
.hero .go { margin-top: 14px; width: 100%; background: #fff; color: var(--red-d); border: 0; border-radius: 999px; padding: 13px; font-size: 17px; font-weight: 600; cursor: pointer; font-family: inherit; }
.hero .go:disabled { opacity: .8; }
.hero .mini { font-size: 12px; opacity: .85; margin-top: 8px; }
.goal { display: flex; align-items: center; gap: 14px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 6px; text-align: center; cursor: pointer; }
.tile .n { font-size: 24px; font-weight: 600; line-height: 1.2; }
.tile .t { font-size: 12px; color: var(--muted); }
.alert { background: var(--soft); color: var(--chip-txt); border-radius: 14px; padding: 10px 12px; font-size: 13px; display: flex; gap: 8px; align-items: center; cursor: pointer; margin: 8px 0; }
.alert.red { background: var(--c-hq-bg); color: var(--c-hq); }
details.more > summary { list-style: none; text-align: center; color: var(--muted); font-size: 13px; padding: 10px; cursor: pointer; }
details.more > summary::-webkit-details-marker { display: none; }
.bar { height: 8px; background: var(--soft2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--orange); border-radius: 99px; }

/* nav */
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line);
  display: flex; justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 5; }
nav.tabs button { flex: 1; background: none; border: 0; color: var(--muted); font-size: 11px; padding: 4px 0; cursor: pointer; font-family: inherit; }
nav.tabs button b { display: block; font-family: var(--zh); font-size: 19px; line-height: 1.2; font-weight: 500; }
nav.tabs button.on { color: var(--red); }
.badge { background: var(--red); color: #fff; border-radius: 99px; font-size: 10px; padding: 0 5px; margin-left: 2px; }

/* review */
.rv-top { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.rv-top .bar { flex: 1; }
.rv-card { min-height: 34vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 6px; }
.rv-han { font-family: var(--zh); font-size: 68px; line-height: 1.15; font-weight: 500; }
.rv-vi { font-size: 24px; font-weight: 600; }
.rv-sent { font-family: var(--zh); font-size: 28px; line-height: 1.5; }
.rv-hint { font-family: var(--zh); font-size: 18px; color: var(--muted); margin-top: 8px; }
.revealed .rv-card { min-height: 0; padding-top: 4px; }
.rv-type { font-size: 12px; color: var(--muted); }
.answer { text-align: left; border-top: 1px dashed var(--line); margin-top: 14px; padding-top: 12px; }
.mean { font-size: 20px; font-weight: 600; margin-top: 4px; }
.ex { background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
.ex .zh { font-size: 18px; }
mark { background: #FFE08A; color: inherit; border-radius: 3px; padding: 0 2px; }
.note { border-left: 3px solid var(--orange); padding: 6px 10px; margin: 8px 0; background: #FFF4E6; border-radius: 0; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 4px 0 12px; }
.rate button { border: 0; border-radius: 14px; padding: 11px 4px; color: #fff; font-weight: 600; font-size: 16px; cursor: pointer; font-family: var(--zh); }
.rate button small { display: block; font-weight: 400; font-size: 11px; opacity: .9; font-family: -apple-system, Roboto, sans-serif; }
.rate button.sug { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }
.r1 { background: var(--again); } .r2 { background: var(--hard); } .r3 { background: var(--okay); color: var(--ink) !important; } .r4 { background: var(--easy); }
.check-ok { color: #5E4320; font-weight: 700; } .check-bad { color: var(--red-d); font-weight: 700; }
.spk { border: 0; background: #FFE3D9; color: #9C2A14; border-radius: 50%; width: 36px; height: 36px; font-size: 16px; cursor: pointer; vertical-align: middle; }
.spk.big { width: 76px; height: 76px; font-size: 30px; }
.say { cursor: pointer; }
.others li { margin: 3px 0; }

/* word page */
.wd-head { display: flex; gap: 14px; align-items: center; }
.wd-han { font-family: var(--zh); font-size: 54px; line-height: 1; cursor: pointer; }
.hw { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.hw > div { border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.sense { border-top: 1px solid var(--line); padding: 12px 0; }
.sense:first-child { border-top: 0; padding-top: 0; }
.sense.closed { opacity: .65; }
.list-item { padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 12px; align-items: center; }
.list-item .zh { font-size: 24px; min-width: 64px; }
.hit { background: var(--soft); border-radius: 14px; padding: 10px 12px; margin-top: 10px; }

/* modal + toast */
.modal { position: fixed; inset: 0; background: rgba(59,36,21,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.modal > div { background: var(--card); width: 100%; max-width: 640px; max-height: 90vh; overflow: auto;
  border-radius: 22px 22px 0 0; padding: 16px; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: #fff;
  padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30; max-width: 90%; text-align: center; }
.sync { font-size: 12px; }
.loading { text-align: center; padding: 60px 0; color: var(--muted); }
table.mini { width: 100%; border-collapse: collapse; font-size: 14px; }
table.mini td, table.mini th { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: left; }
table.mini td.n { text-align: right; font-variant-numeric: tabular-nums; }
.seg { display: flex; background: var(--soft); border-radius: 12px; padding: 3px; gap: 3px; }
.seg { border-radius: 999px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 8px; font-size: 14px; cursor: pointer; color: var(--chip-txt); font-family: inherit; }
.seg button.on { background: var(--card); color: var(--link); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }

/* ---- v1.2: big characters in 田字格 */
.tzg-row { display: flex; justify-content: center; gap: 6px; margin: 6px 0; cursor: pointer; }
.tzg { position: relative; display: inline-flex; align-items: center; justify-content: center; font-family: var(--zh-serif);
  font-weight: 600; color: var(--ink); background: var(--card); border: 2px solid var(--red);
  background-image: linear-gradient(var(--grid), var(--grid)), linear-gradient(var(--grid), var(--grid)),
    linear-gradient(45deg, transparent calc(50% - .5px), var(--grid) 50%, transparent calc(50% + .5px)),
    linear-gradient(-45deg, transparent calc(50% - .5px), var(--grid) 50%, transparent calc(50% + .5px));
  background-size: 100% 1px, 1px 100%, 100% 100%, 100% 100%; background-position: center, center, center, center; background-repeat: no-repeat; }
.tzg-x { font-family: var(--zh); align-self: center; font-size: 40px; }
.tzg-lg .tzg { width: 120px; height: 120px; font-size: 92px; }
.tzg-md .tzg { width: 96px; height: 96px; font-size: 72px; }
.tzg-sm .tzg { width: 76px; height: 76px; font-size: 56px; }
.tzg-xs .tzg { width: 58px; height: 58px; font-size: 42px; border-width: 1.5px; }
@media (max-width: 400px) { .tzg-lg .tzg { width: 104px; height: 104px; font-size: 80px; } .tzg-md .tzg { width: 84px; height: 84px; font-size: 62px; } }
.rv-han { font-family: var(--zh-serif); font-weight: 600; }

/* answers */
input.ans-zh { font-size: 28px; text-align: center; padding: 12px; }
input.ans-py { font-size: 20px; text-align: center; letter-spacing: .5px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 10px; }
.choice { text-align: left; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 10px 12px;
  font-size: 15px; cursor: pointer; font-family: inherit; line-height: 1.35; }
.choice b { color: var(--muted); font-weight: 600; margin-right: 4px; }
.choice.on { border-color: var(--orange); background: var(--soft); box-shadow: 0 0 0 1px var(--orange); }
.blank { color: var(--red); letter-spacing: 2px; }

/* verdict */
.card.rv { border-width: 2px; }
.card.v-ok { border-color: var(--ok); } .card.v-bad { border-color: var(--again); } .card.v-part { border-color: var(--hard); }
.verdict { margin: -14px -14px 12px; padding: 14px 16px; border-radius: 14px 14px 0 0; }
.verdict.ok { background: var(--ok-bg); color: var(--ok); }
.verdict.bad { background: var(--bad-bg); color: var(--again); }
.verdict.part { background: var(--part-bg); color: #A0520A; }
.verdict .vh { font-size: 26px; font-weight: 700; font-family: var(--zh); }
.verdict .vd { font-size: 17px; margin-top: 4px; color: var(--ink); }
.verdict .vd.zh { font-size: 26px; }
.verdict .vl { display: inline-block; min-width: 44px; font-size: 12px; color: var(--muted); font-family: var(--zh); }
.c-ok { color: var(--ok); font-weight: 600; } .c-bad { color: var(--again); font-weight: 600; text-decoration: underline wavy; text-underline-offset: 4px; }
.rate button.confirm { outline: 3px dashed var(--ink); outline-offset: 2px; }
.answer .row { margin: 4px 0; }

/* ---- v1.3: card back extras, handwriting, library */
.hv { margin: 8px 0; padding: 8px 10px; border-radius: 12px; background: var(--field); border: 1px solid var(--line); }
.hv b { color: var(--link); font-weight: 600; margin-right: 4px; }
.hv .pt { margin-top: 4px; color: var(--ink); }
.hw-done { display: flex; gap: 6px; justify-content: center; font-size: 30px; min-height: 8px; color: var(--ok); }
.hw-cur { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px; width: 100%; }
.hwbox { display: block !important; border-radius: 6px; touch-action: none; }
.sbar { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--sb-cm); margin-top: 6px; }
.sbar i { display: block; height: 100%; }
.sb-dt { background: var(--sb-dt); } .sb-do { background: var(--sb-do); } .sb-mn { background: var(--sb-mn); }
.sb-hq { background: var(--sb-hq); } .sb-cm { background: transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 10px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
.legend i.sb-cm { background: var(--sb-cm); }
.grow-row { padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.grow-row:last-child { border-bottom: 0; }
.grow-row.sub { padding-left: 12px; }
details.tgroup { padding: 12px 14px; }
details.tgroup > summary { list-style: none; cursor: pointer; }
details.tgroup > summary::-webkit-details-marker { display: none; }
details.tgroup[open] > summary { padding-bottom: 6px; border-bottom: 1px solid var(--line); }

/* ---- v1.4: retries and meaning groups */
.retry { width: 100%; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--part-bg); color: var(--ink); text-align: left; font-size: 14px; }
.retry b { color: var(--hard); }
table.cmp { margin-top: 6px; font-size: 13px; }
table.cmp td.zh { font-size: 18px; white-space: nowrap; }
table.cmp th { font-weight: 500; color: var(--muted); font-size: 12px; }
.grp { margin: 10px 0; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); }
.grp tr.me td { color: var(--link); font-weight: 600; }
.grp a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }

/* ---- v1.5: phones */
html, button, a, input, .choice, .tile, .list-item, .grow-row, [onclick] { touch-action: manipulation; }
body.reviewing nav.tabs { display: none; }
body.reviewing main { padding-bottom: 32px; }
.rate button { min-height: 56px; }

/* ---- v2.0: connect screen, QR */
label.fld { display: block; margin: 12px 0; font-size: 14px; color: var(--muted); }
label.fld input { display: block; width: 100%; margin-top: 6px; }
.err { color: var(--c-again, #c0392b); font-weight: 600; }
.qr { background: #fff; padding: 12px; border-radius: 12px; max-width: 280px; margin: 8px auto; }
.qr svg { display: block; width: 100%; height: auto; }

/* ---- dark theme: Obsidian (neutral surfaces, amber accent) */
html.dark {
  --bg: #0A0B0E; --card: #12141A; --field: #1A1D24; --ink: #F8FAFC; --muted: #94A3B8;
  --line: rgba(226,232,240,.08); --line2: rgba(226,232,240,.16); --soft: rgba(255,122,0,.12); --soft2: rgba(255,168,0,.14);
  --red: #FF7A1A; --red-d: #FFB599; --orange: #FFA800; --amber: #FDA600; --gold-d: #10B981; --link: #FFB599; --chip-txt: #FFB599;
  --grad: linear-gradient(135deg, #FF5E00 0%, #FFA800 100%); --on-grad: #140A02;
  --again: #F43F5E; --hard: #FF7A1A; --okay: #FDA600; --easy: #10B981;
  --ok: #34D399; --ok-bg: rgba(16,185,129,.14); --bad-bg: rgba(244,63,94,.14); --part-bg: rgba(255,122,0,.14); --grid: rgba(255,168,0,.22);
  --c-hq-bg: rgba(244,63,94,.14); --c-hq: #FDA4AF; --c-do-bg: rgba(255,122,0,.14); --c-do: #FFB599; --c-mn-bg: rgba(253,166,0,.14); --c-mn: #FCD34D;
  --c-dt-bg: rgba(16,185,129,.14); --c-dt: #6EE7B7;
  --sb-dt: #10B981; --sb-do: #FF7A1A; --sb-mn: #FDA600; --sb-hq: #F43F5E; --sb-cm: #1A1D24;
  color-scheme: dark;
}
html.dark .hero { background: var(--card); border: 1px solid var(--line2); color: var(--ink); }
html.dark .hero .n { color: var(--orange); }
html.dark .hero .go { background: var(--grad); color: var(--on-grad); }
html.dark .tzg { border-color: #FF8A1F; }
html.dark .r1 { color: #fff; } html.dark .r2, html.dark .r4 { color: #140A02; } html.dark .r3 { color: #140A02 !important; }
html.dark .verdict.ok { color: #34D399; } html.dark .verdict.bad { color: #FDA4AF; } html.dark .verdict.part { color: #FFB599; }
html.dark .streak { background: var(--soft); color: var(--chip-txt); }
html.dark .note { background: var(--field); }
html.dark mark { background: rgba(253,166,0,.22); color: #FCD34D; }
html.dark .spk { background: rgba(255,122,0,.14); color: #FFB599; }
html.dark .vt > b { background: rgba(255,122,0,.16); color: #FFB599; }
html.dark .modal { background: rgba(0,0,0,.65); }
html.dark .toast { background: #F8FAFC; color: #0A0B0E; }
html.dark .choice.on { background: rgba(255,122,0,.14); color: #FFB599; }
html.dark nav.tabs button.on { color: var(--orange); }
html.dark .badge { background: var(--again); }
html.dark .seg { background: var(--field); }
html.dark .seg button { color: var(--muted); }
html.dark .seg button.on { background: var(--card); color: var(--orange); box-shadow: 0 0 0 1px var(--line2); }
html.dark .hw-done { color: #34D399; }
</style>

</head>
<body>
  <main id="view"><div class="loading">加载中… Loading</div></main>
  <nav class="tabs" id="tabs">
    <button data-v="today" class="on"><b>今</b><span>今天</span></button>

  <script>
/* Lõi logic: chỉ hàm thuần, không đụng giao diện. Dùng được cả trong trình duyệt lẫn khi kiểm thử. */
(function (root) {
  var ST = { New: 0, Learning: 1, Review: 2, Relearning: 3 };
  var ST_NAME = ['New', 'Learning', 'Review', 'Relearning'];
  var SENSE_ORDER = ['V1', 'V2', 'V3', 'V4'];
  var SENT_ORDER = ['C1', 'C3', 'C2'];
  var REVIEWS_PER_DAILY_NEW_CARD = 12; // từ mô phỏng FSRS với tham số của bạn (22/11/2026)

  function Core(db, FSRS) {
    this.db = db;
    this.FSRS = FSRS;
    this.sessionLapses = {};
    this.sessionDone = 0;
    this.sessionNew = {};
    this.index();
  }

  Core.prototype.num = function (k, def) {
    var v = Number(this.db.settings[k]);
    return isNaN(v) || this.db.settings[k] === '' ? def : v;
  };
  Core.prototype.list = function (k, def) {
    return String(this.db.settings[k] || def).split(',').map(function (s) { return s.trim(); }).filter(String);
  };

  /** Steps like "1m,10m" or "3m" (m = minutes, h = hours, d = days). Invalid entries are dropped. */
  Core.prototype.steps = function (k, def) {
    var out = this.list(k, def).filter(function (x) { return /^\d+(\.\d+)?[mhd]$/.test(x); });
    return out.length ? out : def.split(',');
  };

  Core.prototype.index = function () {
    var db = this.db, self = this;
    this.wordById = {}; this.wordByHan = {}; this.senseById = {}; this.sensesByWord = {};
    this.sentenceById = {}; this.cardsByItem = {}; this.cardById = {};
    db.words.forEach(function (w) { self.wordById[w.id] = w; self.wordByHan[w.han] = w; });
    db.senses.forEach(function (s) {
      self.senseById[s.id] = s;
      (self.sensesByWord[s.w] = self.sensesByWord[s.w] || []).push(s);
    });
    Object.keys(this.sensesByWord).forEach(function (k) {
      self.sensesByWord[k].sort(function (a, b) { return (a.ord || 0) - (b.ord || 0); });
    });
    db.sentences.forEach(function (q) { self.sentenceById[q.id] = q; });
    db.cards.forEach(function (c) {
      self.cardById[c.id] = c;
      (self.cardsByItem[c.item] = self.cardsByItem[c.item] || []).push(c);
    });
    var params = [];
    try { params = JSON.parse(db.settings.tham_so_fsrs); } catch (e) { params = undefined; }
    this.f = this.FSRS.fsrs(this.FSRS.generatorParameters({
      w: params, request_retention: this.num('ty_le_nho_muc_tieu', 0.9),
      enable_fuzz: true, enable_short_term: true,
      learning_steps: this.steps('buoc_hoc', '1m,10m'),
      relearning_steps: this.steps('buoc_hoc_lai', '3m')
    }));
    this.senseTypes = this.list('chieu_the_bat', 'V1,V2');
    this.sentTypes = this.list('the_cau_bat', 'C1,C2,C3');
  };

  // ---------------------------------------------------------------- time
  Core.prototype.dayStart = function (d) {
    d = d || new Date();
    var x = new Date(d.getTime());
    x.setHours(this.num('gio_bat_dau_ngay', 4), 0, 0, 0);
    if (d < x) x.setDate(x.getDate() - 1);
    return x;
  };
  Core.prototype.dayEnd = function (d) { return new Date(this.dayStart(d).getTime() + 864e5); };

  // ---------------------------------------------------------------- fsrs bridge
  Core.prototype.toTs = function (c) {
    return {
      due: c.due ? new Date(c.due) : new Date(), stability: c.s || 0, difficulty: c.d || 0,
      elapsed_days: 0, scheduled_days: 0, learning_steps: c.step || 0, reps: c.reps || 0,
      lapses: c.lapses || 0, state: ST[c.state] !== undefined ? ST[c.state] : 0,
      last_review: c.last ? new Date(c.last) : undefined
    };
  };
  Core.prototype.applyTs = function (c, t) {
    c.state = ST_NAME[t.state]; c.step = t.learning_steps || 0; c.due = new Date(t.due).toISOString();
    c.s = t.stability; c.d = t.difficulty; c.reps = t.reps; c.lapses = t.lapses;
    c.last = t.last_review ? new Date(t.last_review).toISOString() : '';
  };
  Core.prototype.retrievability = function (c, now) {
    if (c.state === 'New' || !c.last) return 0;
    return this.f.get_retrievability(this.toTs(c), now || new Date(), false);
  };
  Core.prototype.preview = function (c, now) {
    var p = this.f.repeat(this.toTs(c), now || new Date());
    return [1, 2, 3, 4].map(function (g) { return p[g].card.due; });
  };
  /** Rate a card; returns the review record to send to the server. */
  Core.prototype.rate = function (c, grade, ms, now) {
    now = now || new Date();
    var prev = c.state;
    var rec = this.f.next(this.toTs(c), now, grade);
    this.applyTs(c, rec.card);
    if (grade === 1) this.sessionLapses[c.id] = (this.sessionLapses[c.id] || 0) + 1;
    if (prev === 'New') this.sessionNew[c.id] = true;
    this.sessionDone++;
    return { cardId: c.id, rating: grade, ms: Math.max(0, Math.min(60000, ms || 0)), prev: prev, at: now.toISOString(),
      card: { state: c.state, step: c.step, due: c.due, s: c.s, d: c.d, reps: c.reps, lapses: c.lapses, last: c.last } };
  };

  // ---------------------------------------------------------------- status
  Core.prototype.isLearn = function (c) { return c.state === 'Learning' || c.state === 'Relearning'; };
  Core.prototype.intervalDays = function (c) {
    if (!c.last || !c.due) return 0;
    return (new Date(c.due) - new Date(c.last)) / 864e5;
  };
  Core.prototype.lapsesRecent = function (c) {
    return (this.db.lapses30[c.id] || 0) + (this.sessionLapses[c.id] || 0);
  };
  Core.prototype.itemKind = function (id) {
    return this.senseById[id] ? 'sense' : (this.sentenceById[id] ? 'sentence' : 'other');
  };
  Core.prototype.usable = function (c) {
    if (c.susp) return false;
    var s = this.senseById[c.item];
    if (s) {
      // V3 = dictation of the example sentence: only when it is long enough to give context (6+ Chinese characters)
      if (c.type === 'V3' && (String(s.exz || '').match(/[\u3400-\u9fff]/g) || []).length < 6) return false;
      return !!s.open && this.senseTypes.indexOf(c.type) >= 0;
    }
    var q = this.sentenceById[c.item];
    if (q) return !!q.open && this.sentTypes.indexOf(c.type) >= 0 && (c.type !== 'C2' || !!q.audio);
    return false;
  };
  Core.prototype.itemStatus = function (id) {
    var item = this.senseById[id] || this.sentenceById[id];
    if (!item || !item.open) return 'Chưa mở';
    var self = this;
    var cs = (this.cardsByItem[id] || []).filter(function (c) { return self.usable(c); });
    if (!cs.length) return 'Mới nạp';
    var hq = this.num('hay_quen_so_lan', 2);
    if (cs.some(function (c) { return self.lapsesRecent(c) >= hq; })) return 'Hay quên';
    if (cs.every(function (c) { return c.state === 'New'; })) return 'Mới nạp';
    var mature = this.num('da_thuoc_khoang_on_ngay', 21);
    if (cs.every(function (c) { return c.state === 'Review' && self.intervalDays(c) >= mature; })) return 'Đã thuộc';
    return 'Đang ôn';
  };
  var RANK = { 'Hay quên': 4, 'Đang ôn': 3, 'Mới nạp': 2, 'Đã thuộc': 1, 'Chưa mở': 0 };
  Core.prototype.wordStatus = function (wid) {
    var self = this, best = 'Chưa mở';
    (this.sensesByWord[wid] || []).forEach(function (s) {
      var st = self.itemStatus(s.id);
      if (st === 'Chưa mở') return;
      if (best === 'Chưa mở' || RANK[st] > RANK[best]) best = st;
    });
    return best;
  };
  Core.prototype.statusCounts = function () {
    var self = this, out = { 'Chưa mở': 0, 'Mới nạp': 0, 'Đang ôn': 0, 'Đã thuộc': 0, 'Hay quên': 0 };
    this.db.senses.forEach(function (s) { out[self.itemStatus(s.id)]++; });
    return out;
  };

  // ---------------------------------------------------------------- queue
  Core.prototype.reviewsDoneToday = function () {
    return (this.db.last7[this.db.today] || 0) + this.sessionDone;
  };
  Core.prototype.introducedToday = function (kind) {
    var self = this, items = {};
    this.db.newToday.concat(Object.keys(this.sessionNew)).forEach(function (cid) {
      var c = self.cardById[cid];
      if (c && self.itemKind(c.item) === kind) items[c.item] = true;
    });
    return items;
  };
  Core.prototype.levelNum = function (s) {
    var m = String(s || '').match(/HSK (\d)/);
    return m ? Number(m[1]) : 9;
  };

  /** Next new card for an item: earlier card types must already be learned before today. */
  Core.prototype.nextNewCard = function (id, order, ds) {
    var self = this;
    var cs = (this.cardsByItem[id] || []).filter(function (c) { return self.usable(c); });
    var byType = {};
    cs.forEach(function (c) { byType[c.type] = c; });
    for (var i = 0; i < order.length; i++) {
      var c = byType[order[i]];
      if (!c) continue;
      if (c.state === 'New') {
        for (var j = 0; j < i; j++) {
          var p = byType[order[j]];
          if (p && (p.state === 'New' || (p.last && new Date(p.last) >= ds))) return null;
        }
        return { card: c, first: !cs.some(function (x) { return x.state !== 'New'; }) };
      }
    }
    return null;
  };

  Core.prototype.buildQueue = function (now) {
    now = now || new Date();
    var self = this, ds = this.dayStart(now), de = this.dayEnd(now);
    var reviewedToday = function (c) { return c.last && new Date(c.last) >= ds; };

    // 1. due reviews, weakest first; learning steps first
    var due = this.db.cards.filter(function (c) {
      return self.usable(c) && c.state !== 'New' && new Date(c.due) < de;
    });
    due.forEach(function (c) { c._r = self.retrievability(c, now); });
    due.sort(function (a, b) {
      return (self.isLearn(b) - self.isLearn(a)) || (a._r - b._r);
    });
    // in-session learning steps (reviewed today, still learning) always come back, outside the daily cap
    var steps = due.filter(function (c) { return self.isLearn(c) && reviewedToday(c); });
    var seen = {};
    this.db.cards.forEach(function (c) { if (reviewedToday(c)) seen[c.item] = true; });
    var revs = [];
    due.forEach(function (c) {
      if (self.isLearn(c) && reviewedToday(c)) return;  // already in steps
      if (seen[c.item]) return;                           // one card per item per day
      seen[c.item] = true;
      revs.push(c);
    });
    var capacity = Math.min(this.num('toi_da_on_moi_ngay', 400),
      Math.floor(this.num('ngan_sach_on_phut', 30) * 60 / (this.db.avgSec || 12)));
    var room = Math.max(0, capacity - this.reviewsDoneToday());
    var revQ = steps.concat(revs.slice(0, room));
    var backlog = revs.length - Math.min(revs.length, room);

    // 2. new senses (V1 -> V2 -> V3 on later days), one sense per word per day
    var newQ = [];
    var introSense = this.introducedToday('sense');
    var senseLeft = this.num('moi_nghia_moi_ngay', 8) - Object.keys(introSense).length;
    var wordUsed = {};
    Object.keys(introSense).forEach(function (sid) { if (self.senseById[sid]) wordUsed[self.senseById[sid].w] = true; });
    var opened = this.db.senses.filter(function (s) { return s.open; });
    opened.sort(function (a, b) {
      return String(a.open).localeCompare(String(b.open)) || self.levelNum(a.lvl) - self.levelNum(b.lvl) ||
        ((self.wordById[a.w] || {}).freq || 99999) - ((self.wordById[b.w] || {}).freq || 99999) || (a.ord - b.ord);
    });
    // handwriting (V4) cards have their own daily limit
    var v4Seen = {};
    this.db.newToday.concat(Object.keys(this.sessionNew)).forEach(function (cid) { if (/-V4$/.test(cid)) v4Seen[cid] = true; });
    var v4Left = this.num('moi_v4_moi_ngay', 10) - Object.keys(v4Seen).length;
    opened.forEach(function (s) {
      if (seen[s.id]) return;
      var nx = self.nextNewCard(s.id, SENSE_ORDER, ds);
      if (!nx) return;
      if (nx.card.type === 'V4') { if (v4Left <= 0) return; v4Left--; }
      if (nx.first) {
        if (senseLeft <= 0 || wordUsed[s.w]) return;
        senseLeft--; wordUsed[s.w] = true;
      }
      seen[s.id] = true;
      newQ.push(nx.card);
    });
    // 3. new sentences (C1 -> C3 -> C2)
    var introSent = this.introducedToday('sentence');
    var sentLeft = this.num('moi_cau_moi_ngay', 3) - Object.keys(introSent).length;
    this.db.sentences.filter(function (q) { return q.open; })
      .sort(function (a, b) { return String(a.open).localeCompare(String(b.open)); })
      .forEach(function (q) {
        if (seen[q.id]) return;
        var nx = self.nextNewCard(q.id, SENT_ORDER, ds);
        if (!nx) return;
        if (nx.first) { if (sentLeft <= 0) return; sentLeft--; }
        seen[q.id] = true;
        newQ.push(nx.card);
      });

    // 4. interleave: spread new cards through the reviews
    var out = [];
    var gap = newQ.length ? Math.max(1, Math.floor(revQ.length / (newQ.length + 1))) : 0;
    var ri = 0;
    newQ.forEach(function (c) {
      for (var k = 0; k < gap && ri < revQ.length; k++) out.push(revQ[ri++]);
      out.push(c);
    });
    while (ri < revQ.length) out.push(revQ[ri++]);
    return { queue: out, reviews: revQ.length, news: newQ.length, backlog: backlog, capacity: capacity,

/** Pinyin → {l: letters (ü as v), t: tone digits}. Accepts tone marks or numbers (tui1), ü as v / u: / ü. */
function pyParse(s) {

    else if (/[a-z]/.test(ch)) l += ch;

}

    if (T.t === E.t) { best = 'ok'; return; }
    if (T.t.length === E.t.length) {
      var diff = 0; for (var i = 0; i < E.t.length; i++) if (T.t[i] !== E.t[i]) diff++;

    }

}

function readFileB64(file) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onload = function () { res(String(r.result).split(',')[1]); };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function submitAdd() {
  var raw = $('#aRaw').value.trim(), file = $('#aFile').files[0];
  if (!raw && !file) return toast(LT('没有内容', 'Nothing to send', 'Chưa có nội dung'));
  var btn = $('#aGo'); btn.disabled = true;
  var base = { type: $('#aType').value, source: $('#aSrc').value, lesson: $('#aLesson').value.trim() };
  var up = Promise.resolve(null);
  if (file) {
    if (file.size > 15 * 1024 * 1024) { btn.disabled = false; return toast('File > 15 MB'); }
    up = readFileB64(file).then(function (b64) {
      return call('uploadMedia', JSON.stringify({ name: file.name, mime: file.type || 'application/octet-stream',
        b64: b64, kind: /^audio/.test(file.type) ? 'audio' : 'image', source: base.source }));
    });
  }
  up.then(function (m) {
    var lines = $('#aSplit').checked ? raw.split('\n').map(function (s) { return s.trim(); }).filter(String) : [raw || '(xem file đính kèm)'];
    var items = lines.map(function (l) { return { type: base.type, raw: l, source: base.source, lesson: base.lesson, media: m ? m.id : '' }; });
    return call('addInbox', JSON.stringify(items));
  }).then(function (r) {
    toast(LT('已发送 ' + r.ids.length + ' 项', r.ids.length + ' sent', 'Đã gửi ' + r.ids.length + ' mục vào Hộp chờ'));
    APP.db.inbox.waiting += r.ids.length;
    viewAdd();
  }).catch(function (e) { toast('Lỗi: ' + (e.message || e)); btn.disabled = false; });
}

  da_thuoc_khoang_on_ngay: 'Đã thuộc: khoảng ôn tối thiểu (ngày)', goi_y_mo_sau_ngay: 'Ưu tiên gợi ý mục chờ quá (ngày)',
  nhac_khong_mo_moi_ngay: 'Nhắc khi không mở mục mới quá (ngày)', nhac_muc_cho_qua_ngay: 'Nhắc khi mục chờ quá (ngày)',
  gio_bat_dau_ngay: 'Ngày học bắt đầu lúc (giờ sáng)', buoc_hoc: 'Bước học thẻ mới (vd 1m,10m — m phút, h giờ)', buoc_hoc_lai: 'Bước học lại khi quên (vd 3m)', so_ban_sao_luu: 'Số bản sao lưu giữ lại'
};
function viewSettings() {
  var st = APP.db.settings;
  var on = APP.core.list('chieu_the_bat', 'V1,V2'), onC = APP.core.list('the_cau_bat', 'C1,C2,C3');
  var h = '<h1>' + L('设置', 'Settings', 'Cài đặt') + '</h1>';
  h += '<div class="card"><h2 style="margin-top:0">Hiển thị (lưu trên máy này)</h2>' +
    '<label>Ngôn ngữ giao diện</label><div class="seg" id="segLang"><button data-l="zh" class="' + (UI.lang !== 'vi' ? 'on' : '') + '">中文 + English</button>' +
    '<button data-l="vi" class="' + (UI.lang === 'vi' ? 'on' : '') + '">Tiếng Việt</button></div>' +
    '<label>Giao diện sáng / tối</label><div class="seg" id="segTheme">' + [['auto', 'Theo điện thoại'], ['light', 'Sáng'], ['dark', 'Tối']].map(function (t) {
      return '<button data-t="' + t[0] + '" class="' + (UI.theme === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div>' +
    '<label class="row" style="color:var(--ink);margin-top:12px"><input type="checkbox" id="uiPy" style="width:auto"' + (UI.pyShow ? ' checked' : '') + '> Luôn hiện pinyin (mặc định: ẩn, chạm để xem)</label>' +
    '<label class="row" style="color:var(--ink)"><input type="checkbox" id="uiPeek" style="width:auto"' + (UI.peekHard ? ' checked' : '') + '> Mở pinyin trước khi lật thẻ thì gợi ý chấm 难</label>' +
    '<p class="small muted">Ở chế độ 中文 + English: giữ ngón tay lên một nhãn để xem nghĩa tiếng Việt; chạm chữ "VI" để hiện tiếng Việt. Trên máy tính, phím P mở pinyin khi ôn.</p></div>';
  h += '<div class="card"><h2 style="margin-top:0">Chiều thẻ</h2>' +
    ['V1', 'V2', 'V3', 'V4'].map(function (t) {
      return '<label class="row" style="color:var(--ink)"><input type="checkbox" class="ct" value="' + t + '" style="width:auto"' + (on.indexOf(t) >= 0 ? ' checked' : '') + '> ' + t + ' · ' + typeLabel(t, true) + '</label>';
    }).join('') +
    ['C1', 'C2', 'C3'].map(function (t) {
      return '<label class="row" style="color:var(--ink)"><input type="checkbox" class="cs" value="' + t + '" style="width:auto"' + (onC.indexOf(t) >= 0 ? ' checked' : '') + '> ' + t + ' · ' + typeLabel(t, true) + '</label>';
    }).join('') + '<p class="small muted">Tắt một chiều thì thẻ đó tạm dừng, lịch sử vẫn giữ. Bật chiều mới thì app tạo thẻ cho các nghĩa đã mở.</p></div>';
  h += '<div class="card"><h2 style="margin-top:0">Thông số</h2>' + Object.keys(SETTING_LABELS).map(function (k) {
    return '<label>' + esc(SETTING_LABELS[k]) + '</label><input data-k="' + k + '" value="' + esc(st[k]) + '">';
  }).join('') + '<p></p><button class="btn primary big" id="saveSt">Lưu cài đặt</button></div>';
  h += '<div class="card"><h2 style="margin-top:0">Công cụ</h2><div class="row">' +
    '<button class="btn" id="bkNow">Sao lưu ngay</button><button class="btn" id="bkAuto">Bật sao lưu hằng tuần</button>' +
    '<button class="btn" id="diagSend">Gửi chẩn đoán (' + DIAG.length + ')</button>' +
    (GAS ? '' : '<button class="btn" id="cxPhone">Kết nối điện thoại (QR)</button><button class="btn" id="cxOff">Ngắt kết nối máy này</button>') +
    '<button class="btn" onclick="load(true)">Tải lại dữ liệu</button></div>' +
    '<p class="small muted" id="toolOut"></p></div>';
  h += '<p class="small muted">Tham số FSRS và mã thư mục chỉnh trực tiếp trong tab CÀI ĐẶT của file Sheets.</p>';
  $('#view').innerHTML = h;
  $all('#segLang button').forEach(function (b) { b.onclick = function () { UI.lang = b.getAttribute('data-l'); saveUI(); viewSettings(); }; });
  $all('#segTheme button').forEach(function (b) { b.onclick = function () { UI.theme = b.getAttribute('data-t'); saveUI(); viewSettings(); }; });
  $('#uiPy').onchange = function () { UI.pyShow = this.checked; saveUI(); };
  $('#uiPeek').onchange = function () { UI.peekHard = this.checked; saveUI(); };
  $('#saveSt').onclick = function () {
    var map = {};
    $all('input[data-k]').forEach(function (i) { var k = i.getAttribute('data-k'); map[k] = /^buoc_/.test(k) ? i.value.replace(/\s+/g, '') : i.value.trim().replace(',', '.'); });
    map.chieu_the_bat = $all('.ct').filter(function (x) { return x.checked; }).map(function (x) { return x.value; }).join(',');
    map.the_cau_bat = $all('.cs').filter(function (x) { return x.checked; }).map(function (x) { return x.value; }).join(',');
    if (!map.chieu_the_bat) return toast('Cần bật ít nhất một chiều thẻ nghĩa');
    toast('Đang lưu…');
    call('saveSettings', JSON.stringify(map)).then(function () { return call('ensureCards'); })
      .then(function (r) { toast('Đã lưu' + (r.created ? ', tạo thêm ' + r.created + ' thẻ' : '')); return load(true); });
  };
  $('#diagSend').onclick = function () {
    var info = { ua: navigator.userAgent, screen: screen.width + 'x' + screen.height + '@' + (window.devicePixelRatio || 1), view: window.innerWidth + 'x' + window.innerHeight, touch: TOUCH, version: APP.db.version };
    $('#toolOut').textContent = 'Đang gửi…';
    var n = DIAG.length;
    call('saveDiagnostics', JSON.stringify({ info: info, items: DIAG })).then(function () {
      DIAG = DIAG.slice(n); try { localStorage.setItem(DIAG_KEY, JSON.stringify(DIAG)); } catch (e) {}
      $('#toolOut').textContent = 'Đã gửi ' + n + ' dòng chẩn đoán vào tab CHẨN ĐOÁN.';
    }).catch(function (e) { $('#toolOut').textContent = 'Lỗi: ' + (e.message || e); });
  };
  if (!GAS) {
    $('#cxPhone').onclick = function () {
      var link = location.origin + location.pathname + '#c=' + connectCode();
      var show = function () {
        var qr = qrcode(0, 'L'); qr.addData(link); qr.make();
        modal('<h3>Quét bằng camera điện thoại</h3><div class="qr">' + qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true }) + '</div>' +
          '<p class="muted">Mã này chứa khóa truy cập dữ liệu. Không chụp lại, không gửi cho ai. Đóng cửa sổ khi xong.</p>' +
          '<button class="btn" onclick="closeModal()">Đóng</button>');
      };
      if (window.qrcode) return show();
      var sc = document.createElement('script'); sc.src = 'qr.js'; sc.onload = show;
      sc.onerror = function () { toast('Không tải được qr.js'); }; document.head.appendChild(sc);
    };
    $('#cxOff').onclick = function () {
      if (!confirmTwice('cxOff', 'Bấm lần nữa để ngắt kết nối máy này')) return;
      localStorage.removeItem(API_STORE); API = null;
      idbSet('boot', null).catch(function () {});
      viewConnect('Đã ngắt kết nối. Dữ liệu trên máy đã xóa.');
    };
  }
  $('#bkNow').onclick = function () { $('#toolOut').textContent = 'Đang sao lưu…'; call('backupNow').then(function (r) { $('#toolOut').textContent = 'Đã sao lưu: ' + r.name; }); };
  $('#bkAuto').onclick = function () { call('installWeeklyBackup').then(function () { $('#toolOut').textContent = 'Đã bật sao lưu tự động 3 giờ sáng Chủ nhật hằng tuần.'; }); };
}

// ------------------------------------------------------------------ start
function confirmTwice(id, msg) {
  if (APP.confirmId === id && Date.now() - APP.confirmAt < 4000) { APP.confirmId = null; return true; }
  APP.confirmId = id; APP.confirmAt = Date.now(); toast(msg, 3000); return false;
}
applyUI();
load();
if (!GAS && 'serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>

</body>
</html>
